<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود اطلاعات Excel</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
      font-family: Tahoma, Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .text {
      color: #64748b;
      line-height: 1.8;
    }

    .file-label {
      display: inline-block;
      padding: 13px 18px;
      margin-top: 10px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .file-label input {
      display: none;
    }

    .message {
      margin: 18px 0;
      color: #334155;
      font-weight: bold;
    }

    .tools {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .search {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
    }

    .delete-button {
      border: 0;
      padding: 12px 16px;
      color: white;
      background: #dc2626;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .table-box {
      display: none;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #1d4ed8;
      color: white;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    .count {
      display: none;
      color: #475569;
      margin: 12px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>وارد کردن اطلاعات از Excel</h1>

      <p class="text">
        فایل Excel را انتخاب کنید. فایل‌های XLSX، XLS و CSV قابل قبول هستند.
      </p>

      <label class="file-label">
        انتخاب فایل Excel
        <input
          type="file"
          id="excelFile"
          accept=".xlsx,.xls,.csv"
        >
      </label>

      <p class="message" id="message">
        هنوز فایلی انتخاب نشده است
      </p>

      <div class="tools" id="tools">
        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="جست‌وجو در اطلاعات..."
        >

        <button class="delete-button" id="deleteButton">
          حذف همه اطلاعات
        </button>
      </div>

      <p class="count" id="count"></p>

      <div class="table-box" id="tableBox">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let excelRows = [];

    const excelFile = document.getElementById("excelFile");
    const message = document.getElementById("message");
    const tools = document.getElementById("tools");
    const tableBox = document.getElementById("tableBox");
    const tableHead = document.getElementById("tableHead");
    const tableBody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");
    const deleteButton = document.getElementById("deleteButton");
    const count = document.getElementById("count");

    function showTable(rows) {
      if (rows.length === 0) {
        tableBox.style.display = "none";
        count.style.display = "none";
        return;
      }

      const headers = Object.keys(rows[0]);

      tableHead.innerHTML = "";
      tableBody.innerHTML = "";

      const headerRow = document.createElement("tr");

      headers.forEach(function(header) {
        const th = document.createElement("th");
        th.textContent = header;
        headerRow.appendChild(th);
      });

      tableHead.appendChild(headerRow);

      rows.forEach(function(row) {
        const tr = document.createElement("tr");

        headers.forEach(function(header) {
          const td = document.createElement("td");
          td.textContent = row[header] ?? "";
          tr.appendChild(td);
        });

        tableBody.appendChild(tr);
      });

      tableBox.style.display = "block";
      count.style.display = "block";
      count.textContent = "تعداد اطلاعات: " + rows.length;
    }

    function saveData() {
      localStorage.setItem("excelData", JSON.stringify(excelRows));
    }

    function loadSavedData() {
      const savedData = localStorage.getItem("excelData");

      if (!savedData) return;

      try {
        excelRows = JSON.parse(savedData);

        if (excelRows.length > 0) {
          message.textContent =
            excelRows.length + " ردیف اطلاعات قبلاً ذخیره شده است";

          tools.style.display = "flex";
          showTable(excelRows);
        }
      } catch (error) {
        localStorage.removeItem("excelData");
      }
    }

    excelFile.addEventListener("change", function(event) {
      const file = event.target.files[0];

      if (!file) return;

      message.textContent = "در حال خواندن فایل...";

      const reader = new FileReader();

      reader.onload = function(event) {
        try {
          const data = new Uint8Array(event.target.result);
          const workbook = XLSX.read(data, { type: "array" });

          excelRows = [];

          workbook.SheetNames.forEach(function(sheetName) {
            const sheet = workbook.Sheets[sheetName];

            const rows = XLSX.utils.sheet_to_json(sheet, {
              defval: ""
            });

            rows.forEach(function(row) {
              excelRows.push({
                "نام شیت": sheetName,
                ...row
              });
            });
          });

          if (excelRows.length === 0) {
            message.textContent = "فایل خالی است یا اطلاعاتی ندارد";
            return;
          }

          saveData();

          message.textContent =
            "فایل با موفقیت وارد شد: " + excelRows.length + " ردیف";

          tools.style.display = "flex";
          showTable(excelRows);

        } catch (error) {
          message.textContent = "خطا: فایل Excel باز نشد";
        }
      };

      reader.readAsArrayBuffer(file);
    });

    searchInput.addEventListener("input", function() {
      const searchText = searchInput.value.trim().toLowerCase();

      const filteredRows = excelRows.filter(function(row) {
        return Object.values(row).some(function(value) {
          return String(value).toLowerCase().includes(searchText);
        });
      });

      showTable(filteredRows);
    });

    deleteButton.addEventListener("click", function() {
      const confirmed = confirm("همه اطلاعات حذف شود؟");

      if (!confirmed) return;

      excelRows = [];
      localStorage.removeItem("excelData");

      tableHead.innerHTML = "";
      tableBody.innerHTML = "";
      tableBox.style.display = "none";
      tools.style.display = "none";
      count.style.display = "none";
      searchInput.value = "";
      excelFile.value = "";

      message.textContent = "همه اطلاعات حذف شد";
    });

    loadSavedData();
  </script>
</body>
</html>
