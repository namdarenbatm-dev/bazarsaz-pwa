<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b35">
  <title>مدیریت فروش بازارساز</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --navy:#071b35;
      --navy2:#0b2b52;
      --green:#15803d;
      --red:#b42318;
    }

    *{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}

    body{
      margin:0;
      min-height:100vh;
      color:#fff;
      background:
        radial-gradient(circle at top right,#1b528f,transparent 32%),
        var(--navy);
    }

    button,input,select,textarea{font-family:inherit}

    button{
      border:0;
      border-radius:9px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:bold;
    }

    input,select,textarea{
      width:100%;
      margin:6px 0;
      padding:11px;
      border:1px solid #b9c9da;
      border-radius:9px;
      font-size:14px;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    .screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:470px;
      padding:28px;
      color:#172535;
      background:#fff;
      border-radius:18px;
      box-shadow:0 18px 55px #0007;
    }

    .logo{
      font-size:52px;
      text-align:center;
    }

    .box h2{text-align:center}

    .green{color:#fff;background:var(--green)}
    .red{color:#fff;background:var(--red)}
    .white{color:#0b2b52;background:#edf6ff}
    .gray{color:#173253;background:#e7eff7}

    .error{
      min-height:22px;
      color:#b42318;
      text-align:center;
    }

    header,main{
      padding:18px max(18px,calc((100vw - 1250px)/2));
    }

    header{
      display:flex;
      gap:10px;
      align-items:center;
      background:#041426cc;
    }

    .space{flex:1}

    .cards{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .card{
      padding:17px;
      border-radius:14px;
      background:linear-gradient(145deg,#164778,#0c2d54);
    }

    .card small{color:#c5d3e2}

    .card b{
      display:block;
      margin-top:10px;
      font-size:27px;
    }

    .tools{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:10px;
    }

    .tools input,.tools select{
      width:auto;
      min-width:170px;
      margin:0;
      color:#fff;
      background:var(--navy2);
      border:1px solid #ffffff33;
    }

    .tools input{min-width:230px}
    .file{display:none}

    .wrap{
      overflow:auto;
      background:#fff;
      border-radius:14px;
    }

    table{
      width:100%;
      min-width:850px;
      border-collapse:collapse;
      color:#172535;
    }

    th,td{
      padding:11px;
      text-align:right;
      border-bottom:1px solid #dfe8f0;
    }

    th{background:#dcecfb}

    .badge{
      padding:5px 9px;
      border-radius:99px;
      font-size:12px;
      font-weight:bold;
    }

    .ok{color:#166534;background:#dcfce7}
    .talk{color:#075985;background:#e0f2fe}
    .follow{color:#92400e;background:#fef3c7}
    .no{color:#5b21b6;background:#ede9fe}
    .reject{color:#991b1b;background:#fee2e2}

    .modal{
      position:fixed;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      background:#000b;
    }

    .modal .box{
      max-height:92vh;
      overflow:auto;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }

    .actions{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .actions button{flex:1}

    @media(max-width:700px){
      .cards,.two{grid-template-columns:1fr}
      .tools input,.tools select,.tools button{width:100%}
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script>
    const $ = id => document.getElementById(id);

    const PASSWORD_HASH =
      "18b6d0d68af7fa074ec1a5e14fab63579a2ce4e230e0ac607214227d3f201bd6";

    const DATA_KEY = "bazarsaz_customers_final";
    const LOGIN_KEY = "bazarsaz_login_final";

    const statuses = [
      "اوکی",
      "در حال مکالمه",
      "رد شده",
      "پیگیری",
      "پاسخ نداد"
    ];

    let customers = [];

    const escapeHtml = value =>
      String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    const normalize = value =>
      String(value ?? "")
        .normalize("NFKC")
        .trim()
        .toLowerCase()
        .replace(/[يى]/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/\s+/g, " ");

    function createId() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + Math.random().toString(16).slice(2);
    }

    function toEnglishDigits(value) {
      return String(value ?? "")
        .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    }

    function toNumber(value) {
      const text = toEnglishDigits(value)
        .replace(/[,\s٬]/g, "")
        .replace(/٫/g, ".")
        .replace(/[^0-9.-]/g, "");

      const number = Number(text);
      return Number.isFinite(number) ? number : 0;
    }

    function canonicalStatus(value) {
      const text = normalize(value);

      if (["اوکی", "ok", "موفق", "موفق شد", "انجام شد"].includes(text)) {
        return "اوکی";
      }

      if (text.includes("مکالمه") || text.includes("talk")) {
        return "در حال مکالمه";
      }

      if (
        text.includes("رد") ||
        text.includes("نمیخواد") ||
        text.includes("نمی خواهد") ||
        text.includes("rejected")
      ) {
        return "رد شده";
      }

      if (text.includes("پیگیری") || text.includes("follow")) {
        return "پیگیری";
      }

      if (
        text.includes("پاسخ نداد") ||
        text.includes("پاسخ نمیده") ||
        text.includes("پاسخ نمی دهد") ||
        text.includes("جواب نداد") ||
        text.includes("عدم پاسخ") ||
        text.includes("no answer")
      ) {
        return "پاسخ نداد";
      }

      return String(value ?? "").trim();
    }

    async function sha256(value) {
      const buffer = await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(value)
      );

      return [...new Uint8Array(buffer)]
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function saveCustomers() {
      localStorage.setItem(DATA_KEY, JSON.stringify(customers));
    }

    function loadCustomers() {
      try {
        customers = JSON.parse(localStorage.getItem(DATA_KEY)) || [];
      } catch {
        customers = [];
      }
    }

    function showLogin() {
      $("app").innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">🔒</div>
            <h2>ورود به داشبورد</h2>

            <input
              id="password"
              type="password"
              placeholder="رمز عبور"
              autofocus
              onkeydown="if(event.key==='Enter') login()"
            >

            <button class="green" style="width:100%" onclick="login()">
              ورود
            </button>

            <p class="error" id="message"></p>
          </div>
        </section>
      `;
    }

    async function login() {
      const password = $("password").value;
      const enteredHash = await sha256(password);

      if (enteredHash !== PASSWORD_HASH) {
        $("message").textContent = "رمز عبور صحیح نیست.";
        return;
      }

      sessionStorage.setItem(LOGIN_KEY, "1");
      loadCustomers();
      dashboard();
    }

    function lockApp() {
      sessionStorage.removeItem(LOGIN_KEY);
      customers = [];
      showLogin();
    }

    function statusOptions(selected = "") {
      return statuses.map(status => `
        <option value="${status}"
          ${canonicalStatus(selected) === status ? "selected" : ""}>
          ${status}
        </option>
      `).join("");
    }

    function getBadge(status) {
      const value = canonicalStatus(status);

      const className =
        value === "اوکی" ? "ok" :
        value === "در حال مکالمه" ? "talk" :
        value === "رد شده" ? "reject" :
        value === "پیگیری" ? "follow" :
        "no";

      return `
        <span class="badge ${className}">
          ${escapeHtml(value || "نامشخص")}
        </span>
      `;
    }

    function dashboard() {
      $("app").innerHTML = `
        <header>
          <span style="font-size:28px">📊</span>
          <b>مدیریت فروش بازارساز</b>
          <span class="space"></span>
          <button class="white" onclick="lockApp()">قفل کردن</button>
        </header>

        <main>
          <section class="cards">
            <div class="card">
              <small>کل مشتریان</small>
              <b id="totalCustomers">۰</b>
            </div>

            <div class="card">
              <small>فروش‌های موفق</small>
              <b id="successfulCustomers">۰</b>
            </div>

            <div class="card">
              <small>کل تعداد فروش</small>
              <b id="totalSales">۰</b>
            </div>
          </section>

          <section class="tools">
            <button class="white" onclick="openCustomerForm()">
              + ثبت مشتری جدید
            </button>

            <button class="white" onclick="$('excelFile').click()">
              ایمپورت Excel
            </button>

            <input
              class="file"
              id="excelFile"
              type="file"
              accept=".xlsx,.xls,.csv"
              onchange="importExcel(event)"
            >

            <input
              id="search"
              placeholder="جستجوی نام، شماره، شهر یا وضعیت..."
              oninput="render()"
            >

            <select id="filter" onchange="render()">
              <option value="">همه وضعیت‌ها</option>
              ${statusOptions()}
            </select>

            <select id="sort" onchange="render()">
              <option value="desc">فروش: بیشترین به کمترین</option>
              <option value="asc">فروش: کمترین به بیشترین</option>
            </select>
          </section>

          <div class="wrap">
            <table>
              <thead>
                <tr>
                  <th>نام مجموعه</th>
                  <th>مخاطب</th>
                  <th>شماره تماس</th>
                  <th>استان / شهر</th>
                  <th>وضعیت</th>
                  <th>تعداد فروش</th>
                  <th>عملیات</th>
                </tr>
              </thead>

              <tbody id="rows"></tbody>
            </table>
          </div>
        </main>
      `;

      render();
    }

    function render() {
      const search = normalize($("search").value);
      const filter = $("filter").value;
      const sort = $("sort").value;

      $("totalCustomers").textContent =
        customers.length.toLocaleString("fa-IR");

      $("successfulCustomers").textContent =
        customers
          .filter(customer => canonicalStatus(customer.result) === "اوکی")
          .length
          .toLocaleString("fa-IR");

      $("totalSales").textContent =
        customers
          .reduce((sum, customer) => sum + toNumber(customer.sales), 0)
          .toLocaleString("fa-IR");

      let list = customers.filter(customer => {
        const text = normalize([
          customer.company,
          customer.contact,
          customer.phone,
          customer.province,
          customer.city,
          customer.result,
          customer.notes
        ].join(" "));

        return text.includes(search) &&
          (!filter || canonicalStatus(customer.result) === filter);
      });

      list.sort((a, b) =>
        sort === "asc"
          ? toNumber(a.sales) - toNumber(b.sales)
          : toNumber(b.sales) - toNumber(a.sales)
      );

      $("rows").innerHTML = list.length
        ? list.map(customer => `
          <tr>
            <td>${escapeHtml(customer.company)}</td>
            <td>${escapeHtml(customer.contact)}</td>
            <td dir="ltr">${escapeHtml(customer.phone)}</td>
            <td>${escapeHtml(customer.province)} / ${escapeHtml(customer.city)}</td>
            <td>${getBadge(customer.result)}</td>
            <td>${toNumber(customer.sales).toLocaleString("fa-IR")}</td>
            <td>
              <button class="gray" onclick="openCustomerForm('${customer.id}')">
                ویرایش
              </button>
              <button class="red" onclick="deleteCustomer('${customer.id}')">
                حذف
              </button>
            </td>
          </tr>
        `).join("")
        : `
          <tr>
            <td colspan="7" style="text-align:center;padding:30px">
              اطلاعاتی پیدا نشد.
            </td>
          </tr>
        `;
    }

    function openCustomerForm(customerId = null) {
      const customer = customers.find(item => item.id === customerId) || {
        company: "",
        contact: "",
        phone: "",
        province: "",
        city: "",
        result: "",
        sales: "",
        notes: ""
      };

      document.body.insertAdjacentHTML("beforeend", `
        <div class="modal">
          <div class="box">
            <h2>
              ${customerId ? "ویرایش مشتری" : "ثبت مشتری جدید"}
            </h2>

            <div class="two">
              <input id="company" placeholder="نام مجموعه / شرکت"
                value="${escapeHtml(customer.company)}">

              <input id="contact" placeholder="نام مخاطب"
                value="${escapeHtml(customer.contact)}">

              <input id="phone" placeholder="شماره تماس"
                value="${escapeHtml(customer.phone)}">

              <input id="province" placeholder="استان"
                value="${escapeHtml(customer.province)}">

              <input id="city" placeholder="شهر"
                value="${escapeHtml(customer.city)}">

              <select id="result">
                <option value="">وضعیت تماس</option>
                ${statusOptions(customer.result)}
              </select>

              <input id="sales"
                type="text"
                inputmode="numeric"
                placeholder="تعداد فروش"
                value="${escapeHtml(customer.sales)}">
            </div>

            <textarea id="notes" placeholder="یادداشت">${escapeHtml(customer.notes)}</textarea>

            <div class="actions">
              <button class="green" onclick="saveCustomer('${customerId || ""}')">
                ذخیره اطلاعات
              </button>

              <button class="gray" onclick="closeModal()">
                انصراف
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function closeModal() {
      document.querySelector(".modal")?.remove();
    }

    function saveCustomer(customerId) {
      const company = $("company").value.trim();
      const phone = $("phone").value.trim();

      if (!company || !phone) {
        alert("نام مجموعه و شماره تماس را وارد کنید.");
        return;
      }

      const customer = {
        id: customerId || createId(),
        company,
        contact: $("contact").value.trim(),
        phone,
        province: $("province").value.trim(),
        city: $("city").value.trim(),
        result: canonicalStatus($("result").value),
        sales: toNumber($("sales").value),
        notes: $("notes").value.trim()
      };

      const index = customers.findIndex(item => item.id === customer.id);

      if (index >= 0) {
        customers[index] = customer;
      } else {
        customers.unshift(customer);
      }

      saveCustomers();
      closeModal();
      render();
    }

    function deleteCustomer(customerId) {
      if (!confirm("آیا از حذف این مشتری مطمئن هستید؟")) return;

      customers = customers.filter(customer => customer.id !== customerId);

      saveCustomers();
      render();
    }

    function getExcelValue(row, names) {
      const keys = Object.keys(row);

      for (const name of names) {
        const key = keys.find(item => normalize(item) === normalize(name));

        if (key !== undefined) {
          return String(row[key] ?? "").trim();
        }
      }

      return "";
    }

    async function importExcel(event) {
      const file = event.target.files[0];

      if (!file) return;

      try {
        const workbook = XLSX.read(await file.arrayBuffer(), {
          type: "array"
        });

        let added = 0;
        let updated = 0;

        workbook.SheetNames.forEach(sheetName => {
          const sheet = workbook.Sheets[sheetName];

          const rows = XLSX.utils.sheet_to_json(sheet, {
            defval: "",
            raw: false
          });

          rows.forEach(row => {
            const customer = {
              company: getExcelValue(row, [
                "نام مجموعه", "نام شرکت", "شرکت", "مجموعه", "company"
              ]),

              contact: getExcelValue(row, [
                "نام مخاطب", "نام مشتری", "مخاطب", "contact"
              ]),

              phone: getExcelValue(row, [
                "شماره تماس", "تلفن", "موبایل", "phone", "mobile"
              ]),

              province: getExcelValue(row, ["استان", "province"]),

              city: getExcelValue(row, ["شهر", "city"]),

              result: canonicalStatus(getExcelValue(row, [
                "وضعیت تماس", "وضعیت", "نتیجه تماس", "status", "result"
              ])),

              sales: toNumber(getExcelValue(row, [
                "تعداد فروش",
                "فروش",
                "کل فروش",
                "مقدار فروش",
                "فروش کل",
                "تعداد",
                "sales",
                "amount",
                "quantity"
              ])),

              notes: getExcelValue(row, [
                "یادداشت", "توضیحات", "notes"
              ])
            };

            if (!customer.company && !customer.phone) return;

            const oldCustomer = customers.find(item =>
              (customer.phone &&
                normalize(item.phone) === normalize(customer.phone)) ||
              (customer.company &&
                normalize(item.company) === normalize(customer.company))
            );

            if (oldCustomer) {
              Object.assign(oldCustomer, customer);
              updated++;
            } else {
              customers.unshift({
                id: createId(),
                ...customer
              });

              added++;
            }
          });
        });

        saveCustomers();
        render();

        alert(
          "ایمپورت انجام شد.\n" +
          "افزوده‌شده: " + added.toLocaleString("fa-IR") + "\n" +
          "به‌روزرسانی‌شده: " + updated.toLocaleString("fa-IR")
        );
      } catch (error) {
        console.error(error);

        alert(
          "فایل خوانده نشد. لطفاً Excel یا CSV معتبر وارد کنید."
        );
      }

      event.target.value = "";
    }

    if (sessionStorage.getItem(LOGIN_KEY) === "1") {
      loadCustomers();
      dashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
