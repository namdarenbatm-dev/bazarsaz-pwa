<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b35">
  <title>مدیریت فروش بازارساز</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --navy:#071b35; --navy2:#0b2b52; --card:#103866;
      --text:#f8fbff; --muted:#c5d3e2; --line:rgba(255,255,255,.16);
      --green:#15803d; --red:#b42318;
    }

    *{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}

    body{
      margin:0; min-height:100vh; color:var(--text);
      background:
        radial-gradient(circle at top right,#1b528f 0,transparent 32%),
        radial-gradient(circle at bottom left,#103966 0,transparent 28%),
        var(--navy);
    }

    button,input,select,textarea{font-family:inherit}

    button{
      border:0; border-radius:9px; padding:11px 15px; cursor:pointer;
      font-size:14px; font-weight:bold;
    }

    button:hover{filter:brightness(1.08)}
    button:disabled{opacity:.6;cursor:not-allowed}

    input,select,textarea{
      width:100%; border:1px solid #b9c9da; border-radius:9px;
      padding:12px; margin:6px 0; font-size:14px; outline:none;
    }

    textarea{min-height:85px;resize:vertical}

    .screen{
      min-height:100vh; display:flex; align-items:center;
      justify-content:center; padding:20px;
    }

    .box{
      width:100%; max-width:470px; padding:30px; color:#172535;
      background:#fff; border-radius:20px;
      box-shadow:0 18px 55px rgba(0,0,0,.28);
    }

    .logo{margin-bottom:12px;font-size:54px;text-align:center}
    .box h1,.box h2{margin:0 0 10px;text-align:center}

    .green{color:#fff;background:var(--green)}
    .white{color:var(--navy2);background:#edf6ff}
    .red{color:#fff;background:var(--red)}
    .gray{color:#173253;background:#e7eff7}

    .error{
      min-height:24px; margin:10px 0 0; color:#b42318;
      font-size:13px; text-align:center;
    }

    .hint{color:var(--muted);font-size:13px;line-height:2}

    header,main{padding:18px max(18px,calc((100vw - 1380px)/2))}

    header{
      display:flex; align-items:center; gap:10px;
      background:rgba(4,20,38,.76); border-bottom:1px solid var(--line);
    }

    .space{flex:1}

    .cards{
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:14px; margin:5px 0 20px;
    }

    .card{
      min-height:125px; padding:18px;
      background:linear-gradient(145deg,#164778,#0c2d54);
      border:1px solid var(--line); border-radius:15px;
    }

    .card small{color:var(--muted)}
    .card b{display:block;margin-top:13px;font-size:30px}

    .tools{
      display:flex; flex-wrap:wrap; gap:9px; align-items:center;
      margin:20px 0 8px;
    }

    .tools input,.tools select{
      width:auto; min-width:175px; margin:0; color:#fff;
      background:var(--navy2); border:1px solid var(--line);
    }

    .tools input{min-width:245px}
    .tools input::placeholder{color:#bfd0e2}
    .file-input{display:none}

    .table-wrap{
      overflow-x:auto; margin-top:14px; background:#fff; border-radius:14px;
    }

    table{
      width:100%; min-width:850px; color:#172535;
      background:#fff; border-collapse:collapse;
    }

    th,td{
      padding:12px 10px; text-align:right;
      border-bottom:1px solid #dfe8f0;
    }

    th{color:#0a2c53;background:#dcecfb;font-size:13px}
    td{font-size:13px}
    tbody tr:hover td{background:#f0f8ff}

    .empty-row{padding:30px;color:#64748b;text-align:center}

    .status-badge{
      display:inline-block; padding:5px 10px; font-size:12px;
      font-weight:bold; border-radius:999px;
    }

    .status-ok{color:#166534;background:#dcfce7}
    .status-talking{color:#075985;background:#e0f2fe}
    .status-followup{color:#92400e;background:#fef3c7}
    .status-noanswer{color:#5b21b6;background:#ede9fe}
    .status-rejected{color:#991b1b;background:#fee2e2}

    .modal{
      position:fixed; z-index:10; inset:0; display:flex;
      align-items:center; justify-content:center; padding:14px;
      background:rgba(0,0,0,.67);
    }

    .modal .box{max-height:92vh;overflow-y:auto}

    .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

    .modal-actions{display:flex;gap:8px;margin-top:12px}
    .modal-actions button{flex:1}

    @media(max-width:760px){
      header,main{padding-right:14px;padding-left:14px}
      .cards{grid-template-columns:1fr}
      .tools input,.tools select,.tools button{width:100%}
      .two{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    const PASSWORD_HASH =
      "18b6d0d68af7fa074ec1a5e14fab63579a2ce4e230e0ac607214227d3f201bd6";

    const STORAGE_KEY = "bazarsaz_customers_v1";
    const LOGIN_KEY = "bazarsaz_logged_in";

    const statuses = [
      "اوکی",
      "در حال مکالمه",
      "پیگیری",
      "پاسخ نداد",
      "رد شده"
    ];

    let customers = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .trim()
        .toLowerCase()
        .replace(/[يى]/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/\s+/g, " ");
    }

    function toNumber(value) {
      const text = String(value ?? "")
        .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/[,٬]/g, "");

      const number = Number(text);
      return Number.isFinite(number) ? number : 0;
    }

    function canonicalStatus(value) {
      const text = normalize(value);

      if (["اوکی", "ok", "موفق"].includes(text)) return "اوکی";
      if (text.includes("مکالمه") || text.includes("talk")) return "در حال مکالمه";
      if (text.includes("پیگیری") || text.includes("follow")) return "پیگیری";
      if (text.includes("پاسخ نداد") || text.includes("عدم پاسخ")) return "پاسخ نداد";
      if (text.includes("رد") || text.includes("rejected")) return "رد شده";

      return String(value ?? "").trim();
    }

    function createId() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString() + Math.random().toString(16).slice(2);
    }

    async function hashText(value) {
      const bytes = new TextEncoder().encode(value);
      const buffer = await crypto.subtle.digest("SHA-256", bytes);

      return Array.from(new Uint8Array(buffer))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function saveCustomers() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
    }

    function loadCustomers() {
      try {
        customers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        customers = [];
      }
    }

    function loginScreen() {
      app.innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">🔒</div>
            <h2>ورود به داشبورد</h2>

            <input
              id="loginPass"
              type="password"
              placeholder="رمز عبور"
              autofocus
              onkeydown="if(event.key==='Enter') login()"
            >

            <button class="green" style="width:100%" onclick="login()">
              ورود
            </button>

            <p class="error" id="message"></p>
          </div>
        </section>
      `;
    }

    async function login() {
      const password = document.getElementById("loginPass").value;
      const message = document.getElementById("message");

      const enteredHash = await hashText(password);

      if (enteredHash !== PASSWORD_HASH) {
        message.textContent = "رمز عبور صحیح نیست.";
        return;
      }

      sessionStorage.setItem(LOGIN_KEY, "true");
      loadCustomers();
      dashboard();
    }

    function lockApp() {
      sessionStorage.removeItem(LOGIN_KEY);
      customers = [];
      loginScreen();
    }

    function statusOptions(selected = "") {
      return statuses.map(status => `
        <option value="${escapeHtml(status)}"
          ${canonicalStatus(selected) === status ? "selected" : ""}>
          ${escapeHtml(status)}
        </option>
      `).join("");
    }

    function getStatusClass(status) {
      const value = canonicalStatus(status);

      if (value === "اوکی") return "status-ok";
      if (value === "در حال مکالمه") return "status-talking";
      if (value === "پیگیری") return "status-followup";
      if (value === "رد شده") return "status-rejected";

      return "status-noanswer";
    }

    function dashboard() {
      app.innerHTML = `
        <header>
          <span style="font-size:30px">📊</span>
          <b>مدیریت فروش بازارساز</b>
          <span class="space"></span>
          <button class="white" onclick="lockApp()">قفل کردن</button>
        </header>

        <main>
          <section class="cards">
            <div class="card">
              <small>کل مشتریان</small>
              <b id="allCount">۰</b>
            </div>

            <div class="card">
              <small>فروش‌های موفق</small>
              <b id="okCount">۰</b>
            </div>

            <div class="card">
              <small>کل فروش</small>
              <b id="salesCount">۰</b>
            </div>
          </section>

          <section class="tools">
            <button class="white" onclick="customerForm()">
              + ثبت مشتری
            </button>

            <button class="white" onclick="document.getElementById('excelFile').click()">
              ایمپورت Excel
            </button>

            <input
              id="excelFile"
              class="file-input"
              type="file"
              accept=".xlsx,.xls,.csv"
              onchange="importExcelFile(event)"
            >

            <input
              id="search"
              placeholder="جستجوی نام، شماره، شهر یا وضعیت..."
              oninput="render()"
            >

            <select id="filter" onchange="render()">
              <option value="">همه وضعیت‌ها</option>
              ${statusOptions()}
            </select>

            <select id="sortSales" onchange="render()">
              <option value="desc">فروش: بیشترین به کمترین</option>
              <option value="asc">فروش: کمترین به بیشترین</option>
            </select>
          </section>

          <p class="hint">
            اطلاعات مشتری‌ها در مرورگر همان دستگاه ذخیره می‌شوند.
          </p>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>نام مجموعه</th>
                  <th>نام مخاطب</th>
                  <th>شماره تماس</th>
                  <th>استان / شهر</th>
                  <th>وضعیت تماس</th>
                  <th>تعداد فروش</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </main>
      `;

      render();
    }

    function render() {
      const search = normalize(document.getElementById("search")?.value);
      const filter = document.getElementById("filter")?.value;
      const sort = document.getElementById("sortSales")?.value || "desc";

      const totalSales = customers.reduce(
        (sum, customer) => sum + toNumber(customer.sales),
        0
      );

      document.getElementById("allCount").textContent =
        customers.length.toLocaleString("fa-IR");

      document.getElementById("okCount").textContent =
        customers
          .filter(customer => canonicalStatus(customer.result) === "اوکی")
          .length
          .toLocaleString("fa-IR");

      document.getElementById("salesCount").textContent =
        totalSales.toLocaleString("fa-IR");

      let list = customers.filter(customer => {
        const text = normalize([
          customer.company,
          customer.contact,
          customer.phone,
          customer.province,
          customer.city,
          customer.result,
          customer.notes
        ].join(" "));

        return text.includes(search) &&
          (!filter || canonicalStatus(customer.result) === canonicalStatus(filter));
      });

      list.sort((a, b) => sort === "asc"
        ? toNumber(a.sales) - toNumber(b.sales)
        : toNumber(b.sales) - toNumber(a.sales)
      );

      const rows = document.getElementById("rows");

      rows.innerHTML = list.length
        ? list.map(customer => `
          <tr>
            <td>${escapeHtml(customer.company)}</td>
            <td>${escapeHtml(customer.contact)}</td>
            <td dir="ltr">${escapeHtml(customer.phone)}</td>
            <td>${escapeHtml(customer.province)} / ${escapeHtml(customer.city)}</td>
            <td>
              <span class="status-badge ${getStatusClass(customer.result)}">
                ${escapeHtml(canonicalStatus(customer.result) || "نامشخص")}
              </span>
            </td>
            <td>${toNumber(customer.sales).toLocaleString("fa-IR")}</td>
            <td>
              <button class="gray" onclick="customerForm('${customer.id}')">ویرایش</button>
              <button class="red" onclick="removeCustomer('${customer.id}')">حذف</button>
            </td>
          </tr>
        `).join("")
        : `
          <tr>
            <td colspan="7" class="empty-row">
              هیچ مشتری یا فروشی با این فیلتر پیدا نشد.
            </td>
          </tr>
        `;
    }

    function customerForm(id = null) {
      const customer = customers.find(item => item.id === id) || {
        company: "",
        contact: "",
        phone: "",
        province: "",
        city: "",
        result: "",
        sales: "",
        notes: ""
      };

      document.body.insertAdjacentHTML("beforeend", `
        <div class="modal">
          <div class="box">
            <h2>${id ? "ویرایش مشتری" : "ثبت مشتری جدید"}</h2>

            <div class="two">
              <input id="company" placeholder="نام مجموعه / شرکت"
                value="${escapeHtml(customer.company)}">

              <input id="contact" placeholder="نام مخاطب"
                value="${escapeHtml(customer.contact)}">

              <input id="phone" placeholder="شماره تماس"
                value="${escapeHtml(customer.phone)}">

              <input id="province" placeholder="استان"
                value="${escapeHtml(customer.province)}">

              <input id="city" placeholder="شهر"
                value="${escapeHtml(customer.city)}">

              <select id="result">
                <option value="">وضعیت تماس را انتخاب کنید</option>
                ${statusOptions(customer.result)}
              </select>

              <input id="sales" type="number" min="0"
                placeholder="تعداد فروش"
                value="${escapeHtml(customer.sales)}">
            </div>

            <textarea id="notes" placeholder="یادداشت">${escapeHtml(customer.notes)}</textarea>

            <div class="modal-actions">
              <button class="green" onclick="saveCustomer('${id || ""}')">
                ذخیره اطلاعات
              </button>

              <button class="gray" onclick="closeModal()">
                انصراف
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function closeModal() {
      document.querySelector(".modal")?.remove();
    }

    function saveCustomer(id) {
      const company = document.getElementById("company").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!company || !phone) {
        alert("نام مجموعه و شماره تماس را وارد کنید.");
        return;
      }

      const customer = {
        id: id || createId(),
        company,
        contact: document.getElementById("contact").value.trim(),
        phone,
        province: document.getElementById("province").value.trim(),
        city: document.getElementById("city").value.trim(),
        result: canonicalStatus(document.getElementById("result").value),
        sales: toNumber(document.getElementById("sales").value),
        notes: document.getElementById("notes").value.trim()
      };

      const index = customers.findIndex(item => item.id === customer.id);

      if (index >= 0) customers[index] = customer;
      else customers.unshift(customer);

      saveCustomers();
      closeModal();
      render();
    }

    function removeCustomer(id) {
      if (!confirm("آیا از حذف این مشتری مطمئن هستید؟")) return;

      customers = customers.filter(customer => customer.id !== id);
      saveCustomers();
      render();
    }

    function getExcelValue(row, names) {
      const keys = Object.keys(row);

      for (const name of names) {
        const key = keys.find(item => normalize(item) === normalize(name));
        if (key !== undefined) return String(row[key] ?? "").trim();
      }

      return "";
    }

    function importExcelFile(event) {
      const file = event.target.files[0];

      if (!file) return;

      if (!window.XLSX) {
        alert("کتابخانه Excel بارگذاری نشده است. اینترنت را بررسی کنید.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const workbook = XLSX.read(e.target.result, { type: "array" });
          let added = 0;
          let updated = 0;

          workbook.SheetNames.forEach(sheetName => {
            const rows = XLSX.utils.sheet_to_json(
              workbook.Sheets[sheetName],
              { defval: "" }
            );

            rows.forEach(row => {
              const customer = {
                company: getExcelValue(row, ["نام مجموعه","نام شرکت","شرکت","company"]),
                contact: getExcelValue(row, ["نام مخاطب","نام مشتری","contact"]),
                phone: getExcelValue(row, ["شماره تماس","تلفن","موبایل","phone"]),
                province: getExcelValue(row, ["استان","province"]),
                city: getExcelValue(row, ["شهر","city"]),
                result: canonicalStatus(getExcelValue(row, ["وضعیت تماس","وضعیت","status","result"])),
                sales: toNumber(getExcelValue(row, ["تعداد فروش","فروش","sales"])),
                notes: getExcelValue(row, ["یادداشت","توضیحات","notes"])
              };

              if (!customer.company && !customer.phone) return;

              const old = customers.find(item =>
                (customer.phone && normalize(item.phone) === normalize(customer.phone)) ||
                (customer.company && normalize(item.company) === normalize(customer.company))
              );

              if (old) {
                Object.assign(old, customer);
                updated++;
              } else {
                customers.unshift({ id: createId(), ...customer });
                added++;
              }
            });
          });

          saveCustomers();
          render();

          alert(
            "ایمپورت انجام شد.\n" +
            "افزوده‌شده: " + added.toLocaleString("fa-IR") + "\n" +
            "به‌روزرسانی‌شده: " + updated.toLocaleString("fa-IR")
          );
        } catch {
          alert("فایل خوانده نشد. لطفاً فایل Excel یا CSV معتبر وارد کنید.");
        }

        event.target.value = "";
      };

      reader.readAsArrayBuffer(file);
    }

    if (sessionStorage.getItem(LOGIN_KEY) === "true") {
      loadCustomers();
      dashboard();
    } else {
      loginScreen();
    }
  </script>
</body>
</html>
