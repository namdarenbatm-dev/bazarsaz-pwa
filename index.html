<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f5c5c">
  <title>بازارساز هدایت تراکنش</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f5c5c;
      color: white;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: white;
      color: #172525;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: white;
      color: #172525;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 38px #00000022;
    }

    .logo {
      font-size: 56px;
      margin-bottom: 12px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #ccd8d8;
      border-radius: 8px;
      padding: 12px;
      margin: 6px 0;
      font-size: 15px;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .green {
      background: #0f5c5c;
      color: white;
    }

    .white {
      background: white;
      color: #0f5c5c;
    }

    .red {
      background: #b33b31;
      color: white;
    }

    .gray {
      background: #e8f1f0;
      color: #172525;
    }

    .error {
      color: #b33b31;
      min-height: 22px;
      font-size: 13px;
    }

    .hint {
      color: #627070;
      font-size: 13px;
      line-height: 1.9;
    }

    header, main {
      padding: 18px 5%;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #ffffff55;
    }

    .space {
      flex: 1;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      color: #172525;
      border-radius: 12px;
      padding: 14px;
    }

    .card small {
      color: #627070;
    }

    .card b {
      display: block;
      margin-top: 8px;
      font-size: 23px;
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .tools input,
    .tools select {
      width: auto;
      min-width: 155px;
      margin: 0;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      min-width: 760px;
      width: 100%;
      border-collapse: collapse;
      background: white;
      color: #172525;
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      text-align: right;
      padding: 10px 8px;
      border-bottom: 1px solid #e3eaea;
      vertical-align: middle;
    }

    th {
      background: #e8f1f0;
    }

    .empty-row {
      text-align: center;
      padding: 26px;
      color: #627070;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #00000088;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 10;
    }

    .modal .box {
      max-height: 92vh;
      overflow-y: auto;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .file-input {
      display: none;
    }

    @media (max-width: 650px) {
      .cards { grid-template-columns: 1fr 1fr; }
      .two { grid-template-columns: 1fr; }

      .tools input,
      .tools select,
      .tools button {
        width: 100%;
      }

      header {
        padding: 14px 5%;
      }
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    let encryptionKey = null;
    let customers = [];

    const statuses = [
      "اوکی",
      "درحال مکالمه",
      "عدم تمایل",
      "عدم دسترسی",
      "خاموش",
      "تکراری",
      "تغییر شغل",
      "مسدود"
    ];

    function toBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(
          ...bytes.subarray(i, i + chunkSize)
        );
      }

      return btoa(binary);
    }

    function fromBase64(text) {
      const binary = atob(text);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function randomBytes(size) {
      return crypto.getRandomValues(new Uint8Array(size));
    }

    function createId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString() + Math.random().toString(16).slice(2);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/[\s\-_()]/g, "");
    }

    function toEnglishDigits(value) {
      return String(value ?? "")
        .replace(/[۰-۹]/g, digit => "۰۱۲۳۴۵۶۷۸۹".indexOf(digit))
        .replace(/[٠-٩]/g, digit => "٠١٢٣٤٥٦٧٨٩".indexOf(digit))
        .replace(/,/g, "")
        .replace(/٬/g, "");
    }

    function toNumber(value) {
      const result = Number(toEnglishDigits(value));
      return Number.isFinite(result) ? result : 0;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("BazarsazSecureDB", 1);

        request.onupgradeneeded = function () {
          const db = request.result;

          if (!db.objectStoreNames.contains("secure")) {
            db.createObjectStore("secure");
          }
        };

        request.onsuccess = function () {
          resolve(request.result);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    async function dbGet(key) {
      const db = await openDatabase();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction("secure", "readonly");
        const request = transaction.objectStore("secure").get(key);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function dbSet(key, value) {
      const db = await openDatabase();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction("secure", "readwrite");
        transaction.objectStore("secure").put(value, key);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function deriveKey(password, salt) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 300000,
          hash: "SHA-256"
        },
        material,
        {
          name: "AES-GCM",
          length: 256
        },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptText(text) {
      const iv = randomBytes(12);

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        encryptionKey,
        new TextEncoder().encode(text)
      );

      return {
        iv: toBase64(iv),
        data: toBase64(encrypted)
      };
    }

    async function decryptText(vault) {
      const decrypted = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: fromBase64(vault.iv)
        },
        encryptionKey,
        fromBase64(vault.data)
      );

      return new TextDecoder().decode(decrypted);
    }

    async function saveCustomers() {
      const vault = await encryptText(JSON.stringify(customers));
      await dbSet("customers", vault);
    }

    async function loadCustomers() {
      const vault = await dbGet("customers");

      if (!vault) {
        customers = [];
        return;
      }

      customers = JSON.parse(await decryptText(vault));
    }

    function splash() {
      app.innerHTML = `
        <section class="screen">
          <div>
            <div class="logo">🗺️ 💳</div>
            <h1>بازارساز هدایت تراکنش</h1>
            <p>سامانه امن مدیریت مشتریان</p>
          </div>
        </section>
      `;

      setTimeout(auth, 1000);
    }

    async function auth() {
      const config = await dbGet("config");

      if (!config) {
        firstSetup();
      } else {
        loginScreen();
      }
    }

    function firstSetup() {
      app.innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">🗺️ 💳</div>
            <h2>تنظیم رمز مدیر</h2>

            <p>رمز را فراموش نکنید؛ بازیابی اطلاعات بدون آن ممکن نیست.</p>

            <input id="firstPass" type="password" placeholder="رمز مدیر">
            <input id="repeatPass" type="password" placeholder="تکرار رمز مدیر">

            <button class="green" onclick="createPassword()">
              ثبت رمز و ورود
            </button>

            <p class="error" id="message"></p>
          </div>
        </section>
      `;
    }

    async function createPassword() {
      const password = document.getElementById("firstPass").value;
      const repeat = document.getElementById("repeatPass").value;
      const message = document.getElementById("message");

      if (password.length < 6) {
        message.textContent = "رمز باید حداقل ۶ کاراکتر باشد.";
        return;
      }

      if (password !== repeat) {
        message.textContent = "دو رمز یکسان نیستند.";
        return;
      }

      const salt = randomBytes(16);
      encryptionKey = await deriveKey(password, salt);

      const check = await encryptText("Bazarsaz Manager OK");

      await dbSet("config", {
        salt: toBase64(salt),
        check: check
      });

      customers = [];
      await saveCustomers();

      dashboard();
    }

    function loginScreen() {
      app.innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">🗺️ 💳</div>
            <h2>ورود مدیر</h2>

            <input id="loginPass" type="password" placeholder="رمز مدیر">

            <button class="green" onclick="login()">
              ورود
            </button>

            <p class="error" id="message"></p>
          </div>
        </section>
      `;
    }

    async function login() {
      const password = document.getElementById("loginPass").value;
      const config = await dbGet("config");
      const message = document.getElementById("message");

      try {
        encryptionKey = await deriveKey(
          password,
          fromBase64(config.salt)
        );

        const check = await decryptText(config.check);

        if (check !== "Bazarsaz Manager OK") {
          throw new Error("Wrong password");
        }

        await loadCustomers();
        dashboard();
      } catch (error) {
        encryptionKey = null;
        message.textContent = "رمز مدیر صحیح نیست.";
      }
    }

    function statusOptions(selected = "درحال مکالمه") {
      return statuses.map(status => `
        <option ${status === selected ? "selected" : ""}>
          ${status}
        </option>
      `).join("");
    }

    function dashboard() {
      app.innerHTML = `
        <header>
          <span style="font-size:30px">🗺️ 💳</span>
          <b>بازارساز هدایت تراکنش</b>
          <span class="space"></span>
          <button class="white" onclick="lockApp()">قفل</button>
        </header>

        <main>
          <section class="cards">
            <div class="card">
              <small>کل مشتریان</small>
              <b id="allCount">۰</b>
            </div>

            <div class="card">
              <small>نتیجه اوکی</small>
              <b id="okCount">۰</b>
            </div>

            <div class="card">
              <small>کل فروش</small>
              <b id="salesCount">۰</b>
            </div>
          </section>

          <section class="tools">
            <button class="white" onclick="customerForm()">
              + ثبت مشتری
            </button>

            <button class="white" onclick="openExcelPicker()">
              📥 ورود Excel
            </button>

            <input
              id="excelFile"
              class="file-input"
              type="file"
              accept=".xlsx,.xls,.csv"
              onchange="importExcelFile(event)"
            >

            <input
              id="search"
              placeholder="جست‌وجو در شرکت، مخاطب یا تلفن"
              oninput="render()"
            >

            <select id="filter" onchange="render()">
              <option value="">همه وضعیت‌ها</option>
              ${statusOptions("")}
            </select>
          </section>

          <p class="hint">
            فایل Excel را انتخاب کنید. اگر تلفن یا ترکیب نام شرکت و مخاطب تکراری باشد،
            اطلاعات قبلی همان مشتری به‌روزرسانی می‌شود.
          </p>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>شرکت</th>
                  <th>مخاطب</th>
                  <th>تلفن</th>
                  <th>استان / شهر</th>
                  <th>نتیجه</th>
                  <th>فروش</th>
                  <th>عملیات</th>
                </tr>
              </thead>

              <tbody id="rows"></tbody>
            </table>
          </div>
        </main>
      `;

      render();
    }

    function render() {
      const searchInput = document.getElementById("search");
      const filterInput = document.getElementById("filter");

      if (!searchInput || !filterInput) return;

      const search = normalize(searchInput.value);
      const filter = filterInput.value;

      const list = customers.filter(customer => {
        const text = normalize([
          customer.company,
          customer.contact,
          customer.phone,
          customer.province,
          customer.city,
          customer.result,
          customer.notes
        ].join(" "));

        return text.includes(search) &&
          (!filter || customer.result === filter);
      });

      const totalSales = customers.reduce(
        (sum, customer) => sum + toNumber(customer.sales),
        0
      );

      document.getElementById("allCount").textContent =
        customers.length.toLocaleString("fa-IR");

      document.getElementById("okCount").textContent =
        customers
          .filter(item => item.result === "اوکی")
          .length
          .toLocaleString("fa-IR");

      document.getElementById("salesCount").textContent =
        totalSales.toLocaleString("fa-IR");

      const rows = document.getElementById("rows");

      if (!list.length) {
        rows.innerHTML = `
          <tr>
            <td colspan="7" class="empty-row">
              هنوز مشتری ثبت نشده است یا نتیجه‌ای پیدا نشد.
            </td>
          </tr>
        `;
        return;
      }

      rows.innerHTML = list.map(customer => `
        <tr>
          <td>${escapeHtml(customer.company)}</td>
          <td>${escapeHtml(customer.contact)}</td>
          <td>${escapeHtml(customer.phone)}</td>
          <td>
            ${escapeHtml(customer.province)}
            /
            ${escapeHtml(customer.city)}
          </td>
          <td>${escapeHtml(customer.result)}</td>
          <td>${toNumber(customer.sales).toLocaleString("fa-IR")}</td>
          <td>
            <button class="gray" onclick="customerForm('${customer.id}')">
              ویرایش
            </button>

            <button class="red" onclick="removeCustomer('${customer.id}')">
              حذف
            </button>
          </td>
        </tr>
      `).join("");
    }

    function customerForm(id = null) {
      const oldCustomer = customers.find(item => item.id === id) || {
        company: "",
        contact: "",
        phone: "",
        province: "",
        city: "",
        result: "درحال مکالمه",
        sales: "",
        notes: ""
      };

      document.body.insertAdjacentHTML("beforeend", `
        <div class="modal">
          <div class="box">
            <h2>${id ? "ویرایش مشتری" : "ثبت مشتری جدید"}</h2>

            <div class="two">
              <input id="company" placeholder="نام شرکت" value="${escapeHtml(oldCustomer.company)}">
              <input id="contact" placeholder="نام مخاطب" value="${escapeHtml(oldCustomer.contact)}">
              <input id="phone" placeholder="شماره تماس" value="${escapeHtml(oldCustomer.phone)}">
              <input id="province" placeholder="استان" value="${escapeHtml(oldCustomer.province)}">
              <input id="city" placeholder="شهر" value="${escapeHtml(oldCustomer.city)}">

              <select id="result">
                ${statusOptions(oldCustomer.result)}
              </select>

              <input
                id="sales"
                type="number"
                placeholder="مقدار فروش"
                value="${escapeHtml(oldCustomer.sales)}"
              >
            </div>

            <textarea id="notes" placeholder="یادداشت">${escapeHtml(oldCustomer.notes)}</textarea>

            <p>
              <button class="green" onclick="saveCustomer('${id || ""}')">
                ذخیره
              </button>

              <button class="gray" onclick="closeModal()">انصراف</button>
            </p>
          </div>
        </div>
      `);
    }

    async function saveCustomer(id = "") {
      const customer = {
        id: id || createId(),
        company: document.getElementById("company").value.trim(),
        contact: document.getElementById("contact").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        province: document.getElementById("province").value.trim(),
        city: document.getElementById("city").value.trim(),
        result: document.getElementById("result").value,
        sales: document.getElementById("sales").value,
        notes: document.getElementById("notes").value.trim()
      };

      if (!customer.company && !customer.phone) {
        alert("حداقل نام شرکت یا شماره تلفن را وارد کنید.");
        return;
      }

      const index = customers.findIndex(item => item.id === customer.id);

      if (index >= 0) {
        customers[index] = customer;
      } else {
        customers.unshift(customer);
      }

      await saveCustomers();
      closeModal();
      dashboard();
    }

    async function removeCustomer(id) {
      if (!confirm("این مشتری حذف شود؟")) return;

      customers = customers.filter(customer => customer.id !== id);
      await saveCustomers();
      render();
    }

    function openExcelPicker() {
      document.getElementById("excelFile").click();
    }

    function getExcelValue(row, names) {
      const keys = Object.keys(row);

      for (const name of names) {
        const foundKey = keys.find(
          key => normalize(key) === normalize(name)
        );

        if (foundKey !== undefined) {
          return String(row[foundKey] ?? "").trim();
        }
      }

      return "";
    }

    function normalizeStatus(value) {
      const text = normalize(value);

      const found = statuses.find(
        status => normalize(status) === text
      );

      return found || "درحال مکالمه";
    }

    function customerFromExcelRow(row) {
      const company = getExcelValue(row, [
        "نام شرکت",
        "شرکت",
        "نام مجموعه",
        "مجموعه",
        "company",
        "company name"
      ]);

      const contact = getExcelValue(row, [
        "مخاطب",
        "نام مخاطب",
        "مسئول",
        "contact",
        "contact name"
      ]);

      const phone = getExcelValue(row, [
        "تلفن",
        "شماره تلفن",
        "موبایل",
        "شماره تماس",
        "phone",
        "mobile",
        "tel"
      ]);

      const province = getExcelValue(row, [
        "استان",
        "province"
      ]);

      const city = getExcelValue(row, [
        "شهر",
        "city"
      ]);

      const result = getExcelValue(row, [
        "نتیجه",
        "وضعیت",
        "status",
        "result"
      ]);

      const sales = getExcelValue(row, [
        "فروش",
        "مقدار فروش",
        "مبلغ فروش",
        "sales",
        "amount"
      ]);

      const notes = getExcelValue(row, [
        "یادداشت",
        "توضیحات",
        "notes",
        "note",
        "description"
      ]);

      return {
        company,
        contact,
        phone,
        province,
        city,
        result: normalizeStatus(result),
        sales: toNumber(sales),
        notes
      };
    }

    function findDuplicateCustomer(customer) {
      const phone = normalize(customer.phone);
      const company = normalize(customer.company);
      const contact = normalize(customer.contact);

      return customers.find(item => {
        const oldPhone = normalize(item.phone);
        const oldCompany = normalize(item.company);
        const oldContact = normalize(item.contact);

        if (phone && oldPhone === phone) return true;

        return company &&
          oldCompany === company &&
          contact &&
          oldContact === contact;
      });
    }

    async function importExcelFile(event) {
      const file = event.target.files[0];

      if (!file) return;

      if (!window.XLSX) {
        alert("کتابخانه Excel بارگذاری نشد. اینترنت را بررسی و اپ را دوباره باز کنید.");
        event.target.value = "";
        return;
      }

      const confirmed = confirm(
        "اطلاعات Excel وارد شود؟\n" +
        "رکوردهای تکراری بر اساس تلفن یا نام شرکت و مخاطب به‌روزرسانی می‌شوند."
      );

      if (!confirmed) {
        event.target.value = "";
        return;
      }

      try {
        const fileData = await file.arrayBuffer();
        const workbook = XLSX.read(fileData, {
          type: "array",
          cellDates: true
        });

        let added = 0;
        let updated = 0;
        let skipped = 0;

        workbook.SheetNames.forEach(sheetName => {
          const sheet = workbook.Sheets[sheetName];

          const rows = XLSX.utils.sheet_to_json(sheet, {
            defval: "",
            raw: false
          });

          rows.forEach(row => {
            const customer = customerFromExcelRow(row);

            if (!customer.company && !customer.phone && !customer.contact) {
              skipped++;
              return;
            }

            const duplicate = findDuplicateCustomer(customer);

            if (duplicate) {
              const index = customers.findIndex(
                item => item.id === duplicate.id
              );

              customers[index] = {
                ...duplicate,
                ...customer,
                id: duplicate.id,
                notes: customer.notes || duplicate.notes
              };

              updated++;
            } else {
              customers.unshift({
                id: createId(),
                ...customer
              });

              added++;
            }
          });
        });

        await saveCustomers();
        dashboard();

        alert(
          "ورود اطلاعات با موفقیت انجام شد.\n\n" +
          "افزوده شد: " + added + "\n" +
          "به‌روزرسانی شد: " + updated + "\n" +
          "ردیف خالی: " + skipped
        );
      } catch (error) {
        console.error(error);

        alert(
          "فایل Excel خوانده نشد.\n" +
          "مطمئن شوید فایل با پسوند XLSX، XLS یا CSV باشد."
        );
      } finally {
        event.target.value = "";
      }
    }

    function closeModal() {
      const modal = document.querySelector(".modal");

      if (modal) modal.remove();
    }

    function lockApp() {
      encryptionKey = null;
      customers = [];
      loginScreen();
    }

    splash();
  </script>
</body>
</html>
