<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بازارساز هدایت تراکنش</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f5c5c;
      color: white;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .splash,
    .auth-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      color: #111;
      padding: 20px;
      text-align: center;
    }

    .brand {
      max-width: 400px;
    }

    .logo {
      font-size: 72px;
      margin-bottom: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
    }

    .brand p {
      color: #666;
      margin-top: 10px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 4px solid #d7e4e4;
      border-top-color: #0f5c5c;
      border-radius: 50%;
      margin: 22px auto 0;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .auth-box,
    .modal-box {
      width: 100%;
      max-width: 410px;
      background: white;
      color: #172525;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 12px 38px #00000022;
    }

    .auth-box h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #cbd7d7;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #0f5c5c;
      color: white;
    }

    .light {
      background: white;
      color: #0f5c5c;
    }

    .danger {
      background: #b43a31;
      color: white;
    }

    .message {
      min-height: 22px;
      color: #b43a31;
      font-size: 13px;
      margin-top: 8px;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 5%;
      border-bottom: 1px solid #ffffff55;
    }

    .app-title {
      font-size: 18px;
      font-weight: bold;
    }

    .space {
      flex: 1;
    }

    .main {
      padding: 20px 5%;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      color: #172525;
      border-radius: 12px;
      padding: 15px;
    }

    .card small {
      color: #617070;
    }

    .card strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
    }

    .tools {
      margin: 20px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tools input,
    .tools select {
      width: auto;
      min-width: 160px;
      margin: 0;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 700px;
      background: white;
      color: #172525;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 11px 9px;
      text-align: right;
      border-bottom: 1px solid #e3eaea;
    }

    th {
      background: #e8f1f0;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      background: #e7f4eb;
      color: #17633e;
      font-size: 12px;
    }

    .status.red {
      background: #f7e5e2;
      color: #a3372b;
    }

    .small-button {
      padding: 7px 9px;
      font-size: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: #00000088;
    }

    .modal-box {
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 650px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .two-column {
        grid-template-columns: 1fr;
      }

      .tools input,
      .tools select {
        width: 100%;
      }

      .app-title {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    let customers = JSON.parse(
      localStorage.getItem("bazarsazCustomers") || "[]"
    );

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function hashText(text) {
      const encoded = new TextEncoder().encode(text);
      const result = await crypto.subtle.digest("SHA-256", encoded);
      const bytes = new Uint8Array(result);

      return Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function splashScreen() {
      app.innerHTML = `
        <section class="splash">
          <div class="brand">
            <div class="logo">🗺️ 💳</div>
            <h1>بازارساز هدایت تراکنش</h1>
            <p>سامانه مدیریت مشتریان</p>
            <div class="spinner"></div>
          </div>
        </section>
      `;

      setTimeout(openAuth, 1500);
    }

    function openAuth() {
      const savedPassword = localStorage.getItem("bazarsazManagerPassword");

      if (savedPassword) {
        showLogin();
      } else {
        showFirstSetup();
      }
    }

    function showFirstSetup() {
      app.innerHTML = `
        <section class="auth-page">
          <div class="auth-box">
            <div class="logo">🗺️ 💳</div>
            <h2>تنظیم رمز مدیر</h2>
            <p>این رمز فقط روی همین آیفون ذخیره می‌شود.</p>

            <input id="newPassword" type="password" placeholder="رمز مدیر جدید">
            <input id="repeatPassword" type="password" placeholder="تکرار رمز مدیر">

            <button class="primary" onclick="saveFirstPassword()">
              ثبت رمز و ورود
            </button>

            <p class="message" id="message"></p>
          </div>
        </section>
      `;
    }

    async function saveFirstPassword() {
      const first = document.getElementById("newPassword").value;
      const second = document.getElementById("repeatPassword").value;
      const message = document.getElementById("message");

      if (first.length < 6) {
        message.textContent = "رمز باید حداقل ۶ کاراکتر باشد.";
        return;
      }

      if (first !== second) {
        message.textContent = "دو رمز یکسان نیستند.";
        return;
      }

      const hashed = await hashText(first);

      localStorage.setItem("bazarsazManagerPassword", hashed);
      dashboard();
    }

    function showLogin() {
      app.innerHTML = `
        <section class="auth-page">
          <div class="auth-box">
            <div class="logo">🗺️ 💳</div>
            <h2>ورود مدیر</h2>

            <input
              id="loginPassword"
              type="password"
              placeholder="رمز مدیر"
            >

            <button class="primary" onclick="login()">
              ورود به سامانه
            </button>

            <p class="message" id="message"></p>
          </div>
        </section>
      `;
    }

    async function login() {
      const password = document.getElementById("loginPassword").value;
      const savedHash = localStorage.getItem("bazarsazManagerPassword");
      const enteredHash = await hashText(password);

      if (enteredHash === savedHash) {
        dashboard();
      } else {
        document.getElementById("message").textContent =
          "رمز مدیر صحیح نیست.";
      }
    }

    function dashboard() {
      app.innerHTML = `
        <header class="app-header">
          <div class="logo" style="font-size:34px">🗺️ 💳</div>
          <div class="app-title">بازارساز هدایت تراکنش</div>
          <div class="space"></div>
          <button class="light" onclick="lockApp()">قفل</button>
        </header>

        <main class="main">
          <section class="cards">
            <div class="card">
              <small>کل مشتریان</small>
              <strong id="totalCustomers">۰</strong>
            </div>

            <div class="card">
              <small>نتیجه اوکی</small>
              <strong id="okCustomers">۰</strong>
            </div>

            <div class="card">
              <small>کل فروش</small>
              <strong id="totalSales">۰</strong>
            </div>
          </section>

          <section class="tools">
            <button class="light" onclick="showCustomerForm()">
              + ثبت مشتری جدید
            </button>

            <input
              id="search"
              placeholder="جست‌وجو: شرکت، مخاطب یا تلفن"
              oninput="renderCustomers()"
            >

            <select id="filterResult" onchange="renderCustomers()">
              <option value="">همه وضعیت‌ها</option>
              <option value="اوکی">اوکی</option>
              <option value="درحال مکالمه">درحال مکالمه</option>
              <option value="عدم تمایل">عدم تمایل</option>
              <option value="عدم دسترسی">عدم دسترسی</option>
              <option value="خاموش">خاموش</option>
              <option value="تکراری">تکراری</option>
              <option value="تغییر شغل">تغییر شغل</option>
              <option value="مسدود">مسدود</option>
            </select>
          </section>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>شرکت</th>
                  <th>مخاطب</th>
                  <th>تلفن</th>
                  <th>استان / شهر</th>
                  <th>نتیجه</th>
                  <th>فروش</th>
                  <th>عملیات</th>
                </tr>
              </thead>

              <tbody id="customerRows"></tbody>
            </table>
          </div>
        </main>
      `;

      renderCustomers();
    }

    function renderCustomers() {
      const search = document.getElementById("search").value.trim();
      const selectedResult = document.getElementById("filterResult").value;

      const filtered = customers.filter(customer => {
        const customerText = [
          customer.company,
          customer.contact,
          customer.phone,
          customer.province,
          customer.city,
          customer.result
        ].join(" ");

        const searchMatch = customerText.includes(search);
        const resultMatch =
          !selectedResult || customer.result === selectedResult;

        return searchMatch && resultMatch;
      });

      const totalSales = customers.reduce(
        (sum, customer) => sum + Number(customer.sales || 0),
        0
      );

      const okCount = customers.filter(
        customer => customer.result === "اوکی"
      ).length;

      document.getElementById("totalCustomers").textContent =
        customers.length.toLocaleString("fa-IR");

      document.getElementById("okCustomers").textContent =
        okCount.toLocaleString("fa-IR");

      document.getElementById("totalSales").textContent =
        totalSales.toLocaleString("fa-IR");

      document.getElementById("customerRows").innerHTML = filtered.map(
        customer => {
          const redStatuses = [
            "عدم تمایل",
            "تکراری",
            "مسدود",
            "تغییر شغل"
          ];

          const redClass = redStatuses.includes(customer.result)
            ? "red"
            : "";

          return `
            <tr>
              <td>${escapeHtml(customer.company)}</td>
              <td>${escapeHtml(customer.contact)}</td>
              <td>${escapeHtml(customer.phone)}</td>
              <td>
                ${escapeHtml(customer.province)}
                /
                ${escapeHtml(customer.city)}
              </td>
              <td>
                <span class="status ${redClass}">
                  ${escapeHtml(customer.result)}
                </span>
              </td>
              <td>
                ${Number(customer.sales || 0).toLocaleString("fa-IR")}
              </td>
              <td>
                <button
                  class="small-button danger"
                  onclick="deleteCustomer('${customer.id}')"
                >
                  حذف
                </button>
              </td>
            </tr>
          `;
        }
      ).join("");
    }

    function showCustomerForm() {
      document.body.insertAdjacentHTML("beforeend", `
        <div class="modal">
          <div class="modal-box">
            <h2>ثبت مشتری جدید</h2>

            <div class="two-column">
              <input id="company" placeholder="نام شرکت">
              <input id="contact" placeholder="نام مخاطب">
              <input id="phone" placeholder="شماره تماس">
              <input id="province" placeholder="استان">
              <input id="city" placeholder="شهر">

              <select id="result">
                <option value="اوکی">اوکی</option>
                <option value="درحال مکالمه">درحال مکالمه</option>
                <option value="عدم تمایل">عدم تمایل</option>
                <option value="عدم دسترسی">عدم دسترسی</option>
                <option value="خاموش">خاموش</option>
                <option value="تکراری">تکراری</option>
                <option value="تغییر شغل">تغییر شغل</option>
                <option value="مسدود">مسدود</option>
              </select>

              <input
                id="sales"
                type="number"
                placeholder="مقدار فروش"
              >
            </div>

            <textarea id="notes" placeholder="یادداشت"></textarea>

            <div class="modal-actions">
              <button class="primary" onclick="saveCustomer()">ذخیره</button>
              <button onclick="closeModal()">انصراف</button>
            </div>
          </div>
        </div>
      `);
    }

    function closeModal() {
      document.querySelector(".modal").remove();
    }

    function saveCustomer() {
      const customer = {
        id: Date.now().toString(),
        company: document.getElementById("company").value,
        contact: document.getElementById("contact").value,
        phone: document.getElementById("phone").value,
        province: document.getElementById("province").value,
        city: document.getElementById("city").value,
        result: document.getElementById("result").value,
        sales: document.getElementById("sales").value,
        notes: document.getElementById("notes").value
      };

      customers.unshift(customer);

      localStorage.setItem(
        "bazarsazCustomers",
        JSON.stringify(customers)
      );

      closeModal();
      dashboard();
    }

    function deleteCustomer(id) {
      const approved = confirm("این مشتری حذف شود؟");

      if (!approved) return;

      customers = customers.filter(customer => customer.id !== id);

      localStorage.setItem(
        "bazarsazCustomers",
        JSON.stringify(customers)
      );

      renderCustomers();
    }

    function lockApp() {
      showLogin();
    }

    splashScreen();
  </script>
</body>
</html>
