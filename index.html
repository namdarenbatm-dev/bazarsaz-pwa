<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b35">
  <title>مدیریت فروش بازارساز</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    @font-face {
      font-family: "IRANSansX";
      src: url("./fonts/IRANSansX-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "IRANSansX";
      src: url("./fonts/IRANSansX-Bold.woff2") format("woff2");
      font-weight: 700 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --navy: #071b35;
      --navy-dark: #041426;
      --navy-mid: #0b2b52;
      --navy-light: #123f72;
      --card: #103866;
      --text: #f8fbff;
      --muted: #c5d3e2;
      --line: rgba(255, 255, 255, 0.16);
      --green: #15803d;
      --red: #b42318;
      --gray: #e7eff7;
      --blue: #1677d2;
    }

    * {
      box-sizing: border-box;
      font-family: "IRANSansX", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #1b528f 0%, transparent 32%),
        radial-gradient(circle at bottom left, #103966 0%, transparent 28%),
        var(--navy);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #b9c9da;
      border-radius: 9px;
      padding: 12px;
      margin: 6px 0;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1677d2;
      box-shadow: 0 0 0 3px rgba(22, 119, 210, 0.12);
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, #1b528f 0%, transparent 33%),
        var(--navy);
    }

    .box {
      width: 100%;
      max-width: 470px;
      padding: 30px;
      color: #172535;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
    }

    .logo {
      margin-bottom: 12px;
      font-size: 54px;
      text-align: center;
    }

    .box h1,
    .box h2 {
      margin: 0 0 10px;
      text-align: center;
    }

    .box p {
      line-height: 1.9;
    }

    .green {
      color: white;
      background: var(--green);
    }

    .white {
      color: var(--navy-mid);
      background: #edf6ff;
    }

    .red {
      color: white;
      background: var(--red);
    }

    .gray {
      color: #173253;
      background: var(--gray);
    }

    .error {
      min-height: 24px;
      margin: 10px 0 0;
      color: #b42318;
      font-size: 13px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
    }

    header,
    main {
      padding: 18px max(18px, calc((100vw - 1380px) / 2));
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(4, 20, 38, 0.76);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
    }

    header b {
      font-size: 18px;
    }

    .space {
      flex: 1;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 5px 0 20px;
    }

    .card {
      min-height: 130px;
      padding: 18px;
      color: var(--text);
      background: linear-gradient(145deg, #164778, #0c2d54);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.16);
    }

    .card small {
      color: var(--muted);
      font-size: 13px;
    }

    .card b {
      display: block;
      margin-top: 13px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 900;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin: 20px 0 8px;
    }

    .tools input,
    .tools select {
      width: auto;
      min-width: 175px;
      margin: 0;
      color: white;
      background: #0b2b52;
      border: 1px solid var(--line);
    }

    .tools input {
      min-width: 245px;
    }

    .tools input::placeholder {
      color: #bfd0e2;
    }

    .file-input {
      display: none;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 14px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.16);
    }

    table {
      width: 100%;
      min-width: 850px;
      color: #172535;
      background: white;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: right;
      border-bottom: 1px solid #dfe8f0;
      vertical-align: middle;
    }

    th {
      color: #0a2c53;
      background: #dcecfb;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    td {
      font-size: 13px;
    }

    tbody tr:hover td {
      background: #f0f8ff;
    }

    .empty-row {
      padding: 30px;
      color: #64748b;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      border-radius: 999px;
    }

    .status-ok {
      color: #166534;
      background: #dcfce7;
    }

    .status-talking {
      color: #075985;
      background: #e0f2fe;
    }

    .status-followup {
      color: #92400e;
      background: #fef3c7;
    }

    .status-noanswer {
      color: #5b21b6;
      background: #ede9fe;
    }

    .status-rejected {
      color: #991b1b;
      background: #fee2e2;
    }

    .modal {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(0, 0, 0, 0.67);
    }

    .modal .box {
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal .box h2 {
      color: #0b2b52;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions button {
      flex: 1;
    }

    @media (max-width: 760px) {
      header,
      main {
        padding-right: 14px;
        padding-left: 14px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .tools input,
      .tools select,
      .tools button {
        width: 100%;
      }

      .two {
        grid-template-columns: 1fr;
      }

      header b {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    let encryptionKey = null;
    let customers = [];

    const statuses = [
      "اوکی",
      "در حال مکالمه",
      "پیگیری",
      "پاسخ نداد",
      "رد شده"
    ];

    function toBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(
          ...bytes.subarray(i, i + chunkSize)
        );
      }

      return btoa(binary);
    }

    function fromBase64(text) {
      const binary = atob(text);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function randomBytes(size) {
      return crypto.getRandomValues(new Uint8Array(size));
    }

    function createId() {
      if (crypto.randomUUID) return crypto.randomUUID();

      return Date.now().toString() + Math.random().toString(16).slice(2);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/\s+/g, " ")
        .replace(/-/g, " ");
    }

    function toEnglishDigits(value) {
      return String(value ?? "")
        .replace(/[۰-۹]/g, digit => "۰۱۲۳۴۵۶۷۸۹".indexOf(digit))
        .replace(/[٠-٩]/g, digit => "٠١٢٣٤٥٦٧٨٩".indexOf(digit))
        .replace(/,/g, "")
        .replace(/٬/g, "");
    }

    function toNumber(value) {
      const result = Number(toEnglishDigits(value));

      return Number.isFinite(result) ? result : 0;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("BazarsazSecureDB", 1);

        request.onupgradeneeded = function() {
          const db = request.result;

          if (!db.objectStoreNames.contains("secure")) {
            db.createObjectStore("secure");
          }
        };

        request.onsuccess = function() {
          resolve(request.result);
        };

        request.onerror = function() {
          reject(request.error);
        };
      });
    }

    async function dbGet(key) {
      const db = await openDatabase();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction("secure", "readonly");
        const request = transaction.objectStore("secure").get(key);

        request.onsuccess = function() {
          resolve(request.result);
        };

        request.onerror = function() {
          reject(request.error);
        };
      });
    }

    async function dbSet(key, value) {
      const db = await openDatabase();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction("secure", "readwrite");

        transaction.objectStore("secure").put(value, key);

        transaction.oncomplete = function() {
          resolve();
        };

        transaction.onerror = function() {
          reject(transaction.error);
        };
      });
    }

    async function deriveKey(password, salt) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 300000,
          hash: "SHA-256"
        },
        material,
        {
          name: "AES-GCM",
          length: 256
        },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptText(text) {
      const iv = randomBytes(12);

      const encrypted = await crypto.subtle.encrypt(
        {
          name: "AES-GCM",
          iv: iv
        },
        encryptionKey,
        new TextEncoder().encode(text)
      );

      return {
        iv: toBase64(iv),
        data: toBase64(encrypted)
      };
    }

    async function decryptText(vault) {
      const decrypted = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: fromBase64(vault.iv)
        },
        encryptionKey,
        fromBase64(vault.data)
      );

      return new TextDecoder().decode(decrypted);
    }

    async function saveCustomers() {
      const vault = await encryptText(JSON.stringify(customers));
      await dbSet("customers", vault);
    }

    async function loadCustomers() {
      const vault = await dbGet("customers");

      if (!vault) {
        customers = [];
        return;
      }

      customers = JSON.parse(await decryptText(vault));
    }

    function splash() {
      app.innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">📊</div>
            <h1>مدیریت فروش بازارساز</h1>
            <p class="hint" style="text-align:center">
              در حال آماده‌سازی داشبورد...
            </p>
          </div>
        </section>
      `;

      setTimeout(auth, 700);
    }

    async function auth() {
      const config = await dbGet("config");

      if (!config) {
        firstSetup();
      } else {
        loginScreen();
      }
    }

    function firstSetup() {
      app.innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">🔐</div>
            <h2>تنظیم رمز ورود</h2>

            <p class="hint">
              برای محافظت از اطلاعات مشتریان، یک رمز عبور تعیین کنید.
            </p>

            <input
              id="firstPass"
              type="password"
              placeholder="رمز عبور؛ حداقل ۶ کاراکتر"
            >

            <input
              id="repeatPass"
              type="password"
              placeholder="تکرار رمز عبور"
            >

            <button class="green" style="width:100%" onclick="createPassword()">
              ساخت حساب
            </button>

            <p class="error" id="message"></p>
          </div>
        </section>
      `;
    }

    async function createPassword() {
      const password = document.getElementById("firstPass").value;
      const repeat = document.getElementById("repeatPass").value;
      const message = document.getElementById("message");

      if (password.length < 6) {
        message.textContent = "رمز عبور باید حداقل ۶ کاراکتر باشد.";
        return;
      }

      if (password !== repeat) {
        message.textContent = "تکرار رمز عبور با رمز اصلی یکسان نیست.";
        return;
      }

      const salt = randomBytes(16);

      encryptionKey = await deriveKey(password, salt);

      const check = await encryptText("Bazarsaz Manager OK");

      await dbSet("config", {
        salt: toBase64(salt),
        check: check
      });

      customers = [];
      await saveCustomers();

      dashboard();
    }

    function loginScreen() {
      app.innerHTML = `
        <section class="screen">
          <div class="box">
            <div class="logo">🔒</div>
            <h2>ورود به داشبورد</h2>

            <input
              id="loginPass"
              type="password"
              placeholder="رمز عبور را وارد کنید"
              onkeydown="if(event.key === 'Enter') login()"
            >

            <button class="green" style="width:100%" onclick="login()">
              ورود
            </button>

            <p class="error" id="message"></p>
          </div>
        </section>
      `;
    }

    async function login() {
      const password = document.getElementById("loginPass").value;
      const message = document.getElementById("message");
      const config = await dbGet("config");

      try {
        encryptionKey = await deriveKey(
          password,
          fromBase64(config.salt)
        );

        const check = await decryptText(config.check);

        if (check !== "Bazarsaz Manager OK") {
          throw new Error("Wrong password");
        }

        await loadCustomers();
        dashboard();
      } catch (error) {
        encryptionKey = null;
        message.textContent = "رمز عبور صحیح نیست.";
      }
    }

    function lockApp() {
      encryptionKey = null;
      customers = [];
      loginScreen();
    }

    function statusOptions(selected = "") {
      return statuses.map(status => `
        <option value="${escapeHtml(status)}"
          ${normalize(selected) === normalize(status) ? "selected" : ""}>
          ${escapeHtml(status)}
        </option>
      `).join("");
    }

    function dashboard() {
      app.innerHTML = `
        <header>
          <span style="font-size:30px">📊</span>
          <b>مدیریت فروش بازارساز</b>
          <span class="space"></span>
          <button class="white" onclick="lockApp()">قفل کردن</button>
        </header>

        <main>
          <section class="cards">
            <div class="card">
              <small>کل مشتریان</small>
              <b id="allCount">۰</b>
            </div>

            <div class="card">
              <small>فروش‌های موفق</small>
              <b id="okCount">۰</b>
            </div>

            <div class="card">
              <small>کل فروش</small>
              <b id="salesCount">۰</b>
            </div>
          </section>

          <section class="tools">
            <button class="white" onclick="customerForm()">
              + ثبت مشتری
            </button>

            <button class="white" onclick="openExcelPicker()">
              ایمپورت Excel
            </button>

            <input
              id="excelFile"
              class="file-input"
              type="file"
              accept=".xlsx,.xls,.csv"
              onchange="importExcelFile(event)"
            >

            <input
              id="search"
              placeholder="جستجوی نام، شماره، شهر یا وضعیت..."
              oninput="render()"
            >

            <select id="filter" onchange="render()">
              <option value="">همه وضعیت‌ها</option>
              ${statusOptions("")}
            </select>

            <select id="sortSales" onchange="render()">
              <option value="desc">فروش: بیشترین به کمترین</option>
              <option value="asc">فروش: کمترین به بیشترین</option>
            </select>
          </section>

          <p class="hint">
            کل فروش، مجموع فروش همه مشتریان است و با فیلتر جدول تغییر نمی‌کند.
            جدول به‌صورت پیش‌فرض از بیشترین تعداد فروش به کمترین مرتب شده است.
          </p>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>نام مجموعه</th>
                  <th>نام مخاطب</th>
                  <th>شماره تماس</th>
                  <th>استان / شهر</th>
                  <th>وضعیت تماس</th>
                  <th>تعداد فروش</th>
                  <th>عملیات</th>
                </tr>
              </thead>

              <tbody id="rows"></tbody>
            </table>
          </div>
        </main>
      `;

      render();
    }

    function getStatusClass(status) {
      const value = normalize(status);

      if (value === normalize("اوکی")) return "status-ok";

      if (
        value === normalize("در حال مکالمه") ||
        value === normalize("درحال مکالمه")
      ) {
        return "status-talking";
      }

      if (value === normalize("پیگیری")) return "status-followup";

      if (
        value === normalize("پاسخ نداد") ||
        value === normalize("عدم پاسخ")
      ) {
        return "status-noanswer";
      }

      if (
        value === normalize("رد شده") ||
        value === normalize("رد")
      ) {
        return "status-rejected";
      }

      return "status-noanswer";
    }

    function render() {
      const searchInput = document.getElementById("search");
      const filterInput = document.getElementById("filter");
      const sortInput = document.getElementById("sortSales");

      if (!searchInput || !filterInput || !sortInput) return;

      const search = normalize(searchInput.value);
      const filter = filterInput.value;

      const totalSales = customers.reduce((sum, customer) => {
        return sum + toNumber(customer.sales);
      }, 0);

      const successfulSales = customers.filter(customer => {
        return normalize(customer.result) === normalize("اوکی");
      }).length;

      document.getElementById("allCount").textContent =
        customers.length.toLocaleString("fa-IR");

      document.getElementById("okCount").textContent =
        successfulSales.toLocaleString("fa-IR");

      document.getElementById("salesCount").textContent =
        totalSales.toLocaleString("fa-IR");

      let list = customers.filter(customer => {
        const text = normalize([
          customer.company,
          customer.contact,
          customer.phone,
          customer.province,
          customer.city,
          customer.result,
          customer.notes
        ].join(" "));

        const isSearchMatch = text.includes(search);

        const isStatusMatch =
          !filter ||
          normalize(customer.result) === normalize(filter);

        return isSearchMatch && isStatusMatch;
      });

      list.sort((a, b) => {
        const firstSales = toNumber(a.sales);
        const secondSales = toNumber(b.sales);

        return sortInput.value === "asc"
          ? firstSales - secondSales
          : secondSales - firstSales;
      });

      const rows = document.getElementById("rows");

      if (!list.length) {
        rows.innerHTML = `
          <tr>
            <td colspan="7" class="empty-row">
              هیچ مشتری یا فروشی با این فیلتر پیدا نشد.
            </td>
          </tr>
        `;
        return;
      }

      rows.innerHTML = list.map(customer => `
        <tr>
          <td>${escapeHtml(customer.company)}</td>
          <td>${escapeHtml(customer.contact)}</td>
          <td dir="ltr">${escapeHtml(customer.phone)}</td>
          <td>
            ${escapeHtml(customer.province)}
            /
            ${escapeHtml(customer.city)}
          </td>
          <td>
            <span class="status-badge ${getStatusClass(customer.result)}">
              ${escapeHtml(customer.result || "نامشخص")}
            </span>
          </td>
          <td>
            ${toNumber(customer.sales).toLocaleString("fa-IR")}
          </td>
          <td>
            <button class="gray" onclick="customerForm('${customer.id}')">
              ویرایش
            </button>

            <button class="red" onclick="removeCustomer('${customer.id}')">
              حذف
            </button>
          </td>
        </tr>
      `).join("");
    }

    function customerForm(id = null) {
      const oldCustomer = customers.find(item => item.id === id) || {
        company: "",
        contact: "",
        phone: "",
        province: "",
        city: "",
        result: "",
        sales: "",
        notes: ""
      };

      document.body.insertAdjacentHTML("beforeend", `
        <div class="modal">
          <div class="box">
            <h2>${id ? "ویرایش مشتری" : "ثبت مشتری جدید"}</h2>

            <div class="two">
              <input
                id="company"
                placeholder="نام مجموعه / شرکت"
                value="${escapeHtml(oldCustomer.company)}"
              >

              <input
                id="contact"
                placeholder="نام مخاطب"
                value="${escapeHtml(oldCustomer.contact)}"
              >

              <input
                id="phone"
                placeholder="شماره تماس"
                value="${escapeHtml(oldCustomer.phone)}"
              >

              <input
                id="province"
                placeholder="استان"
                value="${escapeHtml(oldCustomer.province)}"
              >

              <input
                id="city"
                placeholder="شهر"
                value="${escapeHtml(oldCustomer.city)}"
              >

              <select id="result">
                <option value="">وضعیت تماس را انتخاب کنید</option>
                ${statusOptions(oldCustomer.result)}
              </select>

              <input
                id="sales"
                type="number"
                min="0"
                placeholder="تعداد فروش"
                value="${escapeHtml(oldCustomer.sales)}"
              >
            </div>

            <textarea id="notes" placeholder="یادداشت">
${escapeHtml(oldCustomer.notes)}</textarea>

            <div class="modal-actions">
              <button class="green" onclick="saveCustomer('${id || ""}')">
                ذخیره اطلاعات
              </button>

              <button class="gray" onclick="closeModal()">
                انصراف
              </button>
            </div>
          </div>
        </div>
      `);
    }

    async function saveCustomer(id) {
      const company = document.getElementById("company").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const province = document.getElementById("province").value.trim();
      const city = document.getElementById("city").value.trim();
      const result = document.getElementById("result").value;
      const sales = document.getElementById("sales").value;
      const notes = document.getElementById("notes").value.trim();

      if (!company || !phone) {
        alert("نام مجموعه و شماره تماس را وارد کنید.");
        return;
      }

      const customer = {
        id: id || createId(),
        company,
        contact,
        phone,
        province,
        city,
        result: normalizeStatus(result),
        sales: toNumber(sales),
        notes
      };

      const index = customers.findIndex(item => item.id === customer.id);

      if (index >= 0) {
        customers[index] = customer;
      } else {
        customers.unshift(customer);
      }

      await saveCustomers();
      closeModal();
      render();
    }

    async function removeCustomer(id) {
      const confirmed = confirm("آیا از حذف این مشتری مطمئن هستید؟");

      if (!confirmed) return;

      customers = customers.filter(customer => customer.id !== id);

      await saveCustomers();
      render();
    }

    function closeModal() {
      const modal = document.querySelector(".modal");

      if (modal) modal.remove();
    }

    function openExcelPicker() {
      document.getElementById("excelFile").click();
    }

    function getExcelValue(row, names) {
      const keys = Object.keys(row);

      for (const name of names) {
        const foundKey = keys.find(key => {
          return normalize(key) === normalize(name);
        });

        if (foundKey !== undefined) {
          return String(row[foundKey] ?? "").trim();
        }
      }

      return "";
    }

    function normalizeStatus(value) {
      const text = normalize(value);

      const statusMap = {
        "اوکی": "اوکی",
        "ok": "اوکی",
        "موفق": "اوکی",

        "در حال مکالمه": "در حال مکالمه",
        "درحال مکالمه": "در حال مکالمه",
        "talking": "در حال مکالمه",

        "پیگیری": "پیگیری",
        "نیاز به پیگیری": "پیگیری",
        "follow up": "پیگیری",
        "followup": "پیگیری",

        "پاسخ نداد": "پاسخ نداد",
        "عدم پاسخ": "پاسخ نداد",
        "no answer": "پاسخ نداد",

        "رد شده": "رد شده",
        "رد": "رد شده",
        "rejected": "رد شده"
      };

      return statusMap[text] || String(value ?? "").trim();
    }

    function customerFromExcelRow(row) {
      const company = getExcelValue(row, [
        "نام مجموعه",
        "نام شرکت",
        "شرکت",
        "مجموعه",
        "company",
        "company name"
      ]);

      const contact = getExcelValue(row, [
        "نام مخاطب",
        "نام مشتری",
        "مخاطب",
        "contact",
        "contact name",
        "customer"
      ]);

      const phone = getExcelValue(row, [
        "شماره تماس",
        "تلفن",
        "موبایل",
        "phone",
        "mobile",
        "tel"
      ]);

      const province = getExcelValue(row, [
        "استان",
        "province"
      ]);

      const city = getExcelValue(row, [
        "شهر",
        "city"
      ]);

      const result = getExcelValue(row, [
        "وضعیت تماس",
        "وضعیت",
        "نتیجه تماس",
        "status",
        "result"
      ]);

      const sales = getExcelValue(row, [
        "تعداد فروش",
        "فروش",
        "کل فروش",
        "sales",
        "sale",
        "amount"
      ]);

      const notes = getExcelValue(row, [
        "یادداشت",
        "توضیحات",
        "notes",
        "note",
        "description"
      ]);

      return {
        company,
        contact,
        phone,
        province,
        city,
        result: normalizeStatus(result),
        sales: toNumber(sales),
        notes
      };
    }

    function findDuplicateCustomer(customer) {
      const phone = normalize(customer.phone);
      const company = normalize(customer.company);
      const contact = normalize(customer.contact);

      return customers.find(item => {
        const oldPhone = normalize(item.phone);
        const oldCompany = normalize(item.company);
        const oldContact = normalize(item.contact);

        if (phone && oldPhone === phone) return true;

        return (
          company &&
          oldCompany === company &&
          contact &&
          oldContact === contact
        );
      });
    }

    async function importExcelFile(event) {
      const file = event.target.files[0];

      if (!file) return;

      if (!window.XLSX) {
        alert("کتابخانه Excel بارگذاری نشده است. اینترنت را بررسی کنید.");
        event.target.value = "";
        return;
      }

      const confirmed = confirm(
        "اطلاعات فایل وارد شود؟ موارد تکراری به‌روزرسانی خواهند شد."
      );

      if (!confirmed) {
        event.target.value = "";
        return;
      }

      try {
        const fileData = await file.arrayBuffer();

        const workbook = XLSX.read(fileData, {
          type: "array",
          cellDates: true
        });

        let added = 0;
        let updated = 0;
        let skipped = 0;

        workbook.SheetNames.forEach(sheetName => {
          const sheet = workbook.Sheets[sheetName];

          const rows = XLSX.utils.sheet_to_json(sheet, {
            defval: "",
            raw: false
          });

          rows.forEach(row => {
            const customer = customerFromExcelRow(row);

            if (!customer.company && !customer.phone && !customer.contact) {
              skipped++;
              return;
            }

            const duplicate = findDuplicateCustomer(customer);

            if (duplicate) {
              const index = customers.findIndex(
                item => item.id === duplicate.id
              );

              customers[index] = {
                ...duplicate,
                ...customer,
                id: duplicate.id,
                notes: customer.notes || duplicate.notes
              };

              updated++;
            } else {
              customers.unshift({
                id: createId(),
                ...customer
              });

              added++;
            }
          });
        });

        await saveCustomers();
        render();

        alert(
          `ایمپورت با موفقیت انجام شد.\n` +
          `افزوده‌شده: ${added.toLocaleString("fa-IR")}\n` +
          `به‌روزرسانی‌شده: ${updated.toLocaleString("fa-IR")}\n` +
          `ردشده: ${skipped.toLocaleString("fa-IR")}`
        );
      } catch (error) {
        console.error(error);

        alert(
          "فایل خوانده نشد. لطفاً از فایل Excel یا CSV معتبر استفاده کنید."
        );
      } finally {
        event.target.value = "";
      }
    }

    splash();
  </script>
</body>
</html>
